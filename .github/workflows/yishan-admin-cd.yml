name: yishan-admin-cd

# 只发布 Admin 前端：编译后传到七牛存储桶的 admin/ 前缀。
# 与 yishan-api-cd 分开：只改前端时不必重启 API 函数。
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/yishan-admin-cd.yml"
      - "apps/demo/admin/**"
      - "packages/core/admin/**"
      - "packages/core/system-admin/**"
      - "packages/yishan-tiptap/**"
      - "packages/ui/**"
      - "apps/demo/config/**"
      - "apps/demo/app/**"
      - "scripts/**"
      - ".tool-versions"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: "紧急覆盖：跳过对 yishan-fullstack-ci 的等待。"
        required: false
        default: false
        type: boolean

concurrency:
  group: yishan-admin-cd
  cancel-in-progress: true

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require green yishan-fullstack-ci on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SKIP_GATE: ${{ inputs.skip_ci_gate }}
        run: |
          set -euo pipefail
          if [ "$SKIP_GATE" = "true" ]; then
            echo "::warning::skip_ci_gate=true — 跳过 CI 门禁（紧急覆盖），直接部署。"
            exit 0
          fi
          echo "等待 yishan-fullstack-ci @ ${SHA}"
          deadline=$(( $(date +%s) + 3000 ))
          while :; do
            json="$(gh api "repos/${REPO}/actions/workflows/yishan-fullstack-ci.yml/runs?head_sha=${SHA}&per_page=100" 2>/dev/null || echo '{}')"
            status="$(printf '%s' "$json" | jq -r '[.workflow_runs[]? | select(.event != "pull_request")] | sort_by(.created_at) | last | .status // "missing"')"
            conclusion="$(printf '%s' "$json" | jq -r '[.workflow_runs[]? | select(.event != "pull_request")] | sort_by(.created_at) | last | .conclusion // ""')"
            echo "ci status=${status} conclusion=${conclusion}"
            # workflow_dispatch 落在从未跑过 CI 的 commit 上时，"missing" 会一直保持，
            # 白等到超时没有意义，直接给出可操作的提示。
            if [ "$status" = "missing" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::${SHA} 上不存在 yishan-fullstack-ci 运行；如需跳过门禁请勾选 skip_ci_gate。"
              exit 1
            fi
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI 已通过，继续部署。"
                exit 0
              fi
              echo "::error::yishan-fullstack-ci 在该 commit 上结论为 ${conclusion}，拒绝部署。"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::等待 yishan-fullstack-ci（${SHA}）超时；如需紧急部署，请用 workflow_dispatch 并勾选 skip_ci_gate。"
              exit 1
            fi
            sleep 15
          done

  deploy:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile --prod=false

      - name: Prepare yishan-tiptap
        working-directory: packages/yishan-tiptap
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Generate Admin plugin routes
        run: pnpm --filter @yishan/demo-admin exec max setup

      - name: Build Demo Admin
        env:
          # 与 API 端的 ADMIN_BASE_PATH 保持一致：静态资源以 /admin/ 前缀打包，
          # 挂载在 /admin/* 时才能正确命中。
          PUBLIC_PATH: ${{ vars.ADMIN_BASE_PATH || '/admin/' }}
        run: pnpm --filter @yishan/demo-admin build

      - name: Install qshell
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_ACCESS_KEY:-}" ] || [ -z "${QINIU_SECRET_KEY:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error::Qiniu secrets 未配置，无法发布 Admin。"; exit 1
          fi
          VER='v2.19.7'
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) PKG='linux-amd64' ;;
            aarch64|arm64) PKG='linux-arm64' ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          TMP="$(mktemp -d)"
          curl -fL "https://github.com/qiniu/qshell/releases/download/${VER}/qshell-${VER}-${PKG}.tar.gz" -o "$TMP/qshell.tgz"
          tar -xzf "$TMP/qshell.tgz" -C "$TMP"
          sudo install -m 755 "$TMP/qshell" /usr/local/bin/qshell
          rm -rf "$TMP"
          qshell version

      - name: Upload admin dist to Qiniu bucket
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_CDN_DOMAIN: ${{ secrets.QINIU_CDN_DOMAIN }}
        run: |
          set -euo pipefail
          cat > "$HOME/.qshell.json" <<EOF
          {
            "access_key": "${QINIU_ACCESS_KEY}",
            "secret_key": "${QINIU_SECRET_KEY}",
            "use_https": true
          }
          EOF
          chmod 600 "$HOME/.qshell.json"
          qshell qupload2 \
            --src-dir apps/demo/admin/dist \
            --bucket "${QINIU_BUCKET}" \
            --key-prefix admin/ \
            --overwrite \
            --rescan-local \
            --log-level info \
            --thread-count 4
          if [ -n "${QINIU_CDN_DOMAIN:-}" ]; then
            printf '%s\n' "https://${QINIU_CDN_DOMAIN}/admin/index.html" > /tmp/qshell_refresh_urls.txt
            qshell cdnrefresh -i /tmp/qshell_refresh_urls.txt
          fi

      # 上传成功不等于用户能打开：入口 HTML 必须真的可达。
      - name: Verify admin is reachable
        env:
          ADMIN_PUBLIC_URL: ${{ vars.ADMIN_PUBLIC_URL }}
        run: |
          set -euo pipefail
          URL="${ADMIN_PUBLIC_URL:-}"
          if [ -z "$URL" ]; then
            echo "::warning::ADMIN_PUBLIC_URL 未配置，跳过可达性校验。"
            exit 0
          fi
          URL="${URL%/}"
          CODE="000"
          for attempt in 1 2 3 4 5; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${URL}/admin/" || true)"
            if [ "$CODE" = "200" ]; then
              echo "Admin 可达：${URL}/admin/ -> 200"
              exit 0
            fi
            echo "第 ${attempt} 次校验返回 ${CODE}，10s 后重试…"
            sleep 10
          done
          echo "::error::${URL}/admin/ 持续不可达（最后一次 ${CODE}），判定部署失败。"
          exit 1