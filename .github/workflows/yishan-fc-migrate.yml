name: yishan-fc-migrate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run inspects; apply runs pending migrations; reset-and-seed rebuilds the database"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - reset-and-seed
      confirm:
        description: "For apply type APPLY; for reset-and-seed type RESET_AND_SEED."
        required: false
        type: string

concurrency:
  group: yishan-fc-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: YISHAN_API
    permissions:
      contents: read
      id-token: write   # 必需：允许 actions 拿 OIDC token
    env:
      FUNCTION_NAME: ${{ vars.MIGRATION_RUNNER_NAME }}
      FUNCTION_DESCRIPTION: ${{ vars.MIGRATION_RUNNER_DESCRIPTION }}
      FUNCTION_VPC_ID: ${{ vars.FUNCTION_VPC_ID }}
      FUNCTION_VSWITCH_ID: ${{ vars.FUNCTION_VSWITCH_ID }}
      FUNCTION_SECURITY_GROUP: ${{ vars.FUNCTION_SECURITY_GROUP }}
      DATABASE_HOST: ${{ secrets.YISHAN_API_DATABASE_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment variables
        run: |
          set -euo pipefail
          : "${FUNCTION_NAME:?Missing MIGRATION_RUNNER_NAME}"
          : "${FUNCTION_DESCRIPTION:?Missing MIGRATION_RUNNER_DESCRIPTION}"
          : "${FUNCTION_VPC_ID:?Missing FUNCTION_VPC_ID}"
          : "${FUNCTION_VSWITCH_ID:?Missing FUNCTION_VSWITCH_ID}"
          : "${FUNCTION_SECURITY_GROUP:?Missing FUNCTION_SECURITY_GROUP}"

      - name: Require explicit apply confirmation
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$MIGRATION_MODE" = "apply" ] && [ "$MIGRATION_CONFIRM" != "APPLY" ]; then
            echo "Refusing apply: enter APPLY in the confirm field." >&2
            exit 1
          fi
          if [ "$MIGRATION_MODE" = "reset-and-seed" ] && [ "$MIGRATION_CONFIRM" != "RESET_AND_SEED" ]; then
            echo "Refusing reset-and-seed: enter RESET_AND_SEED in the confirm field." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build migration runner package
        working-directory: apps/yishan-api
        run: bash ./deploy/fc3/scripts/prepare-migration-runner.sh

      - name: Install and configure Serverless Devs
        env:
          ROLE_ARN: ${{ secrets.FC_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          npm i -g @serverless-devs/s
          curl -fsSL "https://aliyuncli.alicdn.com/aliyun-cli-linux-3.0.182-amd64.tgz" -o /tmp/aliyun.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp
          if [ -f /tmp/aliyun ]; then sudo mv /tmp/aliyun /usr/local/bin/aliyun; fi
          aliyun --version
          mkdir -p ~/.aliyun
          cat >~/.aliyun/config.json <<'CFG'
          {"current":"fcdeploy","profiles":[{"name":"fcdeploy","mode":"AK","access_key_id":"placeholder","access_key_secret":"placeholder","sts_token":"","ram_role_name":"","ram_role_arn":"","private_key":"","key_pairs_cmd":"","key_pairs_dir":"","language":"en","site":"","retry_timeout":0,"retry_count":0,"process_command":"","credentials_uri":"","oidc_provider_arn":"","oidc_token_file":"","external_id":"","using_oidc":false,"oidc_token_endpoint":"","ram_role_session_name":"","expiration":"","region_id":"cn-shanghai","output_format":"json","timeout":0,"insecure":false,"ssl_verify":true}],"meta_path":""}
          CFG
          chmod 600 ~/.aliyun/config.json
          TOKEN=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-actions" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          RESP=$(aliyun sts AssumeRoleWithOIDC \
            --region cn-hangzhou \
            --RoleArn "$ROLE_ARN" \
            --OIDCProviderArn 'acs:ram::1650595695532785:oidc-provider/github-actions' \
            --OIDCToken "$TOKEN" \
            --RoleSessionName "gha-${{ github.run_id }}" \
            --DurationSeconds 3600)
          AK=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['Credentials']['AccessKeyId'])")
          SK=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['Credentials']['AccessKeySecret'])")
          ST=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['Credentials']['SecurityToken'])")
          mkdir -p ~/.s
          cat >~/.s/access.yaml <<SSHA
          default:
            AccessKeyID: ${AK}
            AccessKeySecret: ${SK}
            SecurityToken: ${ST}
            type: sts
            AccountID: '1650595695532785'
            __provider: Alibaba Cloud
          SSHA
          chmod 600 ~/.s/access.yaml
          echo "  STS issued OK, expires in 1h"

      - name: Deploy and invoke internal migration runner
        working-directory: apps/yishan-api
        env:
          DATABASE_USER: ${{ secrets.YISHAN_API_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.YISHAN_API_DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.YISHAN_API_DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.YISHAN_API_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.YISHAN_API_DATABASE_PORT }}
          ALLOW_PRODUCTION_SEED: ${{ inputs.mode == 'reset-and-seed' && 'true' || 'false' }}
          SEED_ADMIN_PASSWORD: ${{ secrets.YISHAN_API_SEED_ADMIN_PASSWORD }}
          MIGRATION_MODE: ${{ inputs.mode }}
          FUNCTION_REGION: ${{ vars.FUNCTION_REGION }}
          FUNCTION_NAME: ${{ vars.MIGRATION_RUNNER_NAME }}
          FUNCTION_DESCRIPTION: ${{ vars.MIGRATION_RUNNER_DESCRIPTION }}
          FUNCTION_VPC_ID: ${{ vars.FUNCTION_VPC_ID }}
          FUNCTION_VSWITCH_ID: ${{ vars.FUNCTION_VSWITCH_ID }}
          FUNCTION_SECURITY_GROUP: ${{ vars.FUNCTION_SECURITY_GROUP }}
        run: |
          set -euo pipefail
          export DATABASE_PORT="${DATABASE_PORT:-3306}"
          s deploy -t deploy/fc3/templates/runner.yaml -y
          s invoke -t deploy/fc3/templates/runner.yaml --event "{\"mode\":\"${MIGRATION_MODE}\"}" | tee /tmp/migration_invoke.log
          if grep -q '"error"' /tmp/migration_invoke.log; then
            echo "Migration runner returned an error" >&2
            exit 1
          fi

      - name: Remove temporary migration runner after success
        if: success()
        working-directory: apps/yishan-api
        env:
          DATABASE_USER: ${{ secrets.YISHAN_API_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.YISHAN_API_DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.YISHAN_API_DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.YISHAN_API_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.YISHAN_API_DATABASE_PORT }}
          ALLOW_PRODUCTION_SEED: 'false'
          SEED_ADMIN_PASSWORD: unused
          FUNCTION_REGION: ${{ vars.FUNCTION_REGION }}
          FUNCTION_NAME: ${{ vars.MIGRATION_RUNNER_NAME }}
          FUNCTION_DESCRIPTION: ${{ vars.MIGRATION_RUNNER_DESCRIPTION }}
          FUNCTION_VPC_ID: ${{ vars.FUNCTION_VPC_ID }}
          FUNCTION_VSWITCH_ID: ${{ vars.FUNCTION_VSWITCH_ID }}
          FUNCTION_SECURITY_GROUP: ${{ vars.FUNCTION_SECURITY_GROUP }}
        run: |
          set -euo pipefail
          export DATABASE_PORT="${DATABASE_PORT:-3306}"
          s remove -t deploy/fc3/templates/runner.yaml -y
