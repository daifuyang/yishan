name: yishan-fc-migrate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect actual pending migrations or apply the checked-in plan"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      confirm:
        description: "For apply type APPLY."
        required: false
        type: string

concurrency:
  group: yishan-fc-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: YISHAN_API
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit apply confirmation
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$MIGRATION_MODE" = "apply" ] && [ "$MIGRATION_CONFIRM" != "APPLY" ]; then
            echo "Refusing apply: enter APPLY in the confirm field." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install and compile checked-in migration plan
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --filter @yishan/demo-api... build
          pnpm --filter @yishan/demo-api db:migrate --check
      - name: Setup SSH tunnel to ECS internal MySQL
        env:
          ECS_DEPLOYER_SSH_KEY: ${{ secrets.ECS_DEPLOYER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$ECS_DEPLOYER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_DEPLOYER_SSH_KEY" > ~/.ssh/ecs-deployer.pem
          chmod 600 ~/.ssh/ecs-deployer.pem
          ssh -fN -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes \
            -i ~/.ssh/ecs-deployer.pem -L 13306:127.0.0.1:3306 \
            ecs-deployer@139.196.89.64 tunnel-dsh
          for attempt in 1 2 3 4 5; do
            if nc -z 127.0.0.1 13306; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 1
          done
      - name: Inspect or apply application migrations
        working-directory: apps/demo/api
        env:
          DATABASE_USER: ${{ secrets.YISHAN_API_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.YISHAN_API_DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.YISHAN_API_DATABASE_NAME }}
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 13306
          MIGRATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(node -e 'process.stdout.write(`mysql://${encodeURIComponent(process.env.DATABASE_USER)}:${encodeURIComponent(process.env.DATABASE_PASSWORD)}@127.0.0.1:13306/${encodeURIComponent(process.env.DATABASE_NAME)}`)')"
          if [ "$MIGRATION_MODE" = "dry-run" ]; then
            pnpm db:migrate --dry-run
          else
            pnpm db:migrate --apply
          fi
      - name: Cleanup SSH tunnel
        if: always()
        run: pkill -f 'ssh.*13306.*ecs-deployer.*tunnel-dsh' || true
