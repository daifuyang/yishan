name: yishan-fullstack-ci

# 这个工作流原本是**一个** verify job，26 个步骤串成一条直线，墙钟时间 16m36s。
# 但这些步骤之间几乎不存在依赖：Docs 构建和 API 测试互不相干，浏览器套件和
# 移动端检查也是。串行的代价是墙钟时间 = 所有步骤之和，而不是最慢那条线。
#
# 现在按「需要什么」拆成五条线并行：
#   guards  —— 架构守卫 + TipTap 产物自检，不碰数据库
#   admin   —— Admin setup/lint/build/jest
#   api     —— API 构建/类型/迁移/OpenAPI/单测/MySQL 集成测试（要 MySQL + Redis）
#   mobile  —— Taro/Core App/移动端 + Docs
#   package —— 打出可部署产物并校验（依赖 admin 与 api 两个 dist）
#
# 门禁仍以整个工作流为准，yishan-api-cd-ubuntu.yml 的 ci-gate 不需要改动。
#
# 2026-10 起去掉了 browser 那条线（Playwright e2e + 独立 Admin 复用验证）：
# 它要起 MySQL/Redis 容器、装 Chromium，只为跑浏览器用例，却把整条 CI 的
# 墙钟从 8 分钟拖到 12 分钟以上，CD 也因此多等这么久。取舍是**放弃浏览器级的
# 回归覆盖**，保留「代码能编译、能测过、能打出可部署产物」这三道。
# verify-admin-reuse.mjs 本身也要 Chromium，随之一起去掉（脚本仍在仓库里，
# 需要时可在本地跑）。
#
# 迭代部署时不必陪跑：CD 支持 workflow_dispatch + skip_ci_gate=true。
on:
  push:
    paths:
      - ".github/workflows/**"
      - "apps/demo/admin/**"
      - "apps/demo/api/**"
      - "packages/core/**"
      - "apps/demo/config/**"
      - "scripts/**"
      - "packages/yishan-tiptap/**"
      - "packages/ui/**"
      - "packages/core/docs-kit/**"
      - "apps/demo/app/**"
      - "apps/*/docs/**"
      - "docs/**"
      - ".tool-versions"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "apps/demo/admin/**"
      - "apps/demo/api/**"
      - "packages/core/**"
      - "apps/demo/config/**"
      - "scripts/**"
      - "packages/yishan-tiptap/**"
      - "packages/ui/**"
      - "packages/core/docs-kit/**"
      - "apps/demo/app/**"
      - "apps/*/docs/**"
      - "docs/**"
      - ".tool-versions"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

# 每个 job 都要 checkout + 装依赖 + 把 tip tap 编出来，这段固定开销约 60s。
# 刻意不复用成共享 job：GitHub 的 job 之间只能传产物，传不了 node_modules，
# 抽出去并不能省掉任何一条线的安装时间，只是把同一段 YAML 复制到更多地方。
jobs:
  guards:
    name: guards (architecture + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prod=false

      - name: Prepare yishan-tiptap
        run: |
          pnpm --filter @yishan/tiptap typecheck
          pnpm --filter @yishan/tiptap build
          pnpm --filter @yishan/tiptap verify:package

      - name: Verify independent TipTap tarball consumer
        run: pnpm verify:tiptap --output "$RUNNER_TEMP/yishan-tiptap-consumer"

      - name: API and Admin architecture and product manifests
        run: |
          node scripts/check-api-architecture.cjs
          node scripts/check-main-baseline.mjs
          node scripts/check-module-naming.mjs
          node scripts/check-admin-boundaries.mjs
          node scripts/check-deploy-workflows.mjs
          node --test scripts/*.test.mjs scripts/test/*.test.mjs

  admin:
    name: admin (setup, lint, build, jest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prod=false

      - name: Prepare yishan-tiptap
        run: |
          pnpm --filter @yishan/tiptap typecheck
          pnpm --filter @yishan/tiptap build
          pnpm --filter @yishan/tiptap verify:package

      - name: Admin Setup and strict public package typechecks
        run: pnpm typecheck:admin

      - name: Admin public package lint and typechecks
        run: |
          pnpm --filter @yishan/core-admin lint
          pnpm --filter @yishan/core-system-admin lint

      - name: Core Admin build registry tests
        run: pnpm --filter @yishan/core-admin test

      - name: Admin Lint
        run: pnpm --filter @yishan/demo-admin lint

      - name: Admin Build
        env:
          PUBLIC_PATH: /admin/
        run: pnpm --filter @yishan/demo-admin build

      # Admin Test 依赖 Admin Setup 生成的 .umi/ 产物；Max 不在 pretest 钩子上，
      # 必须显式依赖 setup 步骤，确保 jest 能解析 .umi/plugin-initialState 等。
      - name: Admin Test
        run: pnpm --filter @yishan/demo-admin test

      - name: Upload Admin dist for the packaging job
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/demo/admin/dist
          retention-days: 1
          include-hidden-files: false

  api:
    name: api (build, typecheck, migrate, openapi, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: YISHAN_API
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yishan
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prod=false

      - name: Prepare API .env
        working-directory: apps/demo/api
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/yishan
          DATABASE_USER: root
          DATABASE_PASSWORD: root
          DATABASE_NAME: yishan
          DATABASE_HOST: 127.0.0.1
        run: |
          ENV_FILE="$(pwd)/.env"
          : > "$ENV_FILE"
          printf '%s\n' "DATABASE_URL=${DATABASE_URL}" >> "$ENV_FILE"
          printf '%s\n' "DATABASE_USER=${DATABASE_USER}" >> "$ENV_FILE"
          printf '%s\n' "DATABASE_PASSWORD=${DATABASE_PASSWORD}" >> "$ENV_FILE"
          printf '%s\n' "DATABASE_NAME=${DATABASE_NAME}" >> "$ENV_FILE"
          printf '%s\n' "DATABASE_HOST=${DATABASE_HOST}" >> "$ENV_FILE"

      - name: API dependencies and TypeScript build
        run: pnpm -r --filter @yishan/demo-api... build

      - name: API strict typechecks and published migration history
        run: |
          pnpm typecheck:api
          pnpm check:migrations

      - name: API Schema Migrate
        run: pnpm --filter @yishan/demo-api db:migrate --apply

      # 产物自检在下面的 package job 里跑，因为它要把 admin 的静态资源一起打进去；
      # 那需要 admin job 的产物，所以不能在这里做（这里的 dist 只有 API 半边）。

      - name: Verify OpenAPI spec is in sync
        shell: bash
        run: |
          PORT=3100 pnpm --filter @yishan/demo-api start > /tmp/yishan-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/api/docs/json > /dev/null; then
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/yishan-api.log
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/yishan-api.log
              exit 1
            fi
            sleep 1
          done

          pnpm --filter @yishan/demo-api openapi:dump
          pnpm check:openapi

      - name: Verify generated Admin clients are in sync
        run: |
          pnpm --filter @yishan/demo-admin openapi
          git diff --exit-code -- \
            packages/core/system-admin/src/services/generated \
            apps/demo/admin/src/services/generated \
            apps/demo/admin/src/modules/crm/services/generated
          if [ -n "$(git ls-files --others --exclude-standard -- packages/core/system-admin/src/services/generated apps/demo/admin/src/services/generated apps/demo/admin/src/modules/crm/services/generated)" ]; then
            git status --short -- packages/core/system-admin/src/services/generated apps/demo/admin/src/services/generated apps/demo/admin/src/modules/crm/services/generated
            echo "Generated Admin clients contain uncommitted files." >&2
            exit 1
          fi

      - name: API Test
        run: pnpm test:api

      - name: API isolated MySQL integration tests
        env:
          YISHAN_TEST_MYSQL_HOST: 127.0.0.1
          YISHAN_TEST_MYSQL_PORT: '3306'
          YISHAN_TEST_MYSQL_USER: root
          YISHAN_TEST_MYSQL_PASSWORD: root
        run: pnpm test:integration

  mobile:
    name: mobile + docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prod=false

      - name: Check installed Taro versions and local shim
        run: pnpm check:taro

      - name: Core App and mobile product checks
        run: |
          pnpm typecheck:mobile
          pnpm --filter @yishan/core-app test
          pnpm --filter @yishan/demo-app lint
          pnpm --filter @yishan/demo-app test
          pnpm build:mobile
          pnpm build:app
          pnpm --filter @yishan/demo-app build:h5
          node scripts/check-app-boundaries.mjs

      - name: Docs typecheck and production build
        run: |
          pnpm --filter @yishan/docs-kit typecheck
          pnpm --filter @yishan/demo-docs typecheck
          pnpm --filter @yishan/portal-docs typecheck
          pnpm build:docs

  # package-api.mjs 要把 admin 的静态资源一起打进产物的 public/admin。它在拆分前
  # 跑在同一个 job 里，能直接读 admin/dist；拆开后必须显式把 admin 的产物接进来，
  # 否则 cpSync 会因为目录不存在而抛错 —— 这正是我们要保留的那道校验。
  package:
    name: package (deployable API artifact with Admin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [admin, api]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prod=false

      - name: Prepare yishan-tiptap
        run: |
          pnpm --filter @yishan/tiptap build

      - name: Download Admin dist
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: apps/demo/admin/dist

      - name: API dependencies and TypeScript build
        run: pnpm -r --filter @yishan/demo-api... build

      - name: Verify standalone API artifact
        run: node scripts/package-api.mjs --output /tmp/yishan-api-artifact --admin apps/demo/admin/dist
