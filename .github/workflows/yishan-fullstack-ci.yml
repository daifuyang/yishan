name: yishan-fullstack-ci

# 验证工作流（不部署）。生产部署由 yishan-fullstack-cd-fc.yml 负责，其触发分支与目标不受本文件影响。
on:
  push:
    paths:
      - ".github/workflows/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/verification/**"
      - ".tool-versions"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/verification/**"
      - ".tool-versions"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 临时服务库：只用于本次运行，不使用任何仓库 secrets 中的数据库凭据。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yishan
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 从 main 拉出的分支按 main 基线检查；以 all 为目标的运行保持跳过。
      YISHAN_BASELINE_TARGET: ${{ (github.base_ref || github.ref_name) == 'all' && 'all' || 'main' }}
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/yishan
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Toolchain matches .tool-versions
        run: pnpm check:toolchain

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Admin 依赖 TipTap 的 dist 产物，必须先构建。
      - name: TipTap Build
        run: pnpm --filter yishan-tiptap build

      # Admin lint/jest 依赖 max setup 生成的 .umi/。
      - name: Admin Setup
        run: pnpm --filter yishan-admin exec max setup

      # admin lint + docs typecheck + app biome + tsc 基线（app/tiptap）+ 模块命名 + main 基线 + 架构边界
      - name: Lint and guards
        run: pnpm lint

      - name: Script tests
        run: pnpm test:scripts

      - name: Admin Test
        run: pnpm --filter yishan-admin test

      - name: Admin Build
        run: pnpm --filter yishan-admin build

      - name: API TypeScript Build
        run: pnpm --filter yishan-api build:ts

      - name: API Test
        run: pnpm --filter yishan-api test

      - name: App Build
        run: pnpm --filter yishan-app build:weapp

      - name: Docs Build
        run: pnpm --filter yishan-docs build

      # main 未提交 Core 的 drizzle/meta（P0 J3），这里在 CI 工作区临时 generate 以便迁移临时库；
      # 生成结果必须与已提交的 0000_init.sql 完全一致，否则说明 schema 与已提交迁移漂移。
      - name: Core schema matches committed migration
        working-directory: apps/yishan-api
        shell: bash
        run: |
          pnpm db:generate
          generated="$(ls drizzle/*.sql | grep -v '/0000_init.sql$')"
          test "$(echo "$generated" | wc -l)" -eq 1
          diff -q --strip-trailing-cr "$generated" drizzle/0000_init.sql

      # P0 R-01：Core 与模块共用迁移历史，Core 先迁移会让模块迁移被静默跳过。
      # 本临时库刻意先迁移模块再迁移 Core，并用只读诊断确认模块表真实存在；
      # R-01 本身由 test/integration/module-migration.r01.test.ts 以 it.fails 跟踪，P4 修复。
      - name: Migrate disposable CI database
        working-directory: apps/yishan-api
        shell: bash
        run: |
          for dir in src/modules/*/; do
            # 与 onboard / build:ts 相同的装载判定（meta.enabled !== false）
            if node --input-type=module -e "import { isPackedModuleDir } from './scripts/module-pack.mjs'; process.exit(isPackedModuleDir('$dir') ? 0 : 1)"; then
              (cd "$dir" && ../../../node_modules/.bin/drizzle-kit --config=./drizzle.config.ts migrate)
            fi
          done
          pnpm db:migrate

      - name: Module tables exist (read-only diagnostic)
        run: node apps/yishan-api/scripts/check-module-tables.mjs

      - name: Dump runtime OpenAPI
        run: node apps/yishan-api/scripts/dump-openapi-from-build.mjs "$RUNNER_TEMP/openapi.runtime.json"

      - name: Committed openapi.json matches runtime
        run: pnpm check:openapi "$RUNNER_TEMP/openapi.runtime.json"

      # 重构契约门禁：与 P0 记录的 main 运行时契约比较，只有 allow 文件逐项批准的差异可以通过。
      - name: Runtime contract matches P0 baseline
        run: >-
          node scripts/openapi-diff.mjs
          docs/verification/yishan-source-first-p0/evidence/openapi/main-6a5c62a-development.json
          "$RUNNER_TEMP/openapi.runtime.json"
          --allow scripts/baselines/openapi-allowed-changes.json

      - name: Generated admin client matches openapi.json
        shell: bash
        run: |
          pnpm --filter yishan-admin openapi
          git diff --exit-code -- apps/yishan-admin/src/services/generated

      - name: API Integration Tests (disposable MySQL/Redis)
        env:
          YISHAN_RUN_INTEGRATION: "1"
          YISHAN_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/yishan_it
          YISHAN_TEST_REDIS_URL: redis://127.0.0.1:6379/1
        run: pnpm --filter yishan-api test:integration
