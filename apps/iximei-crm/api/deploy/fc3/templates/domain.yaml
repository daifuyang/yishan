edition: 3.0.0
name: iximei-crm-domain
access: default   # OIDC STS profile written by the deploying workflow
vars:
  region: ${env(FUNCTION_REGION)}
  functionName: ${env(FUNCTION_NAME)}
  domainName: ${env(CUSTOM_DOMAIN)}
resources:
  iximei_crm_domain:
    component: fc3-domain
    props:
      region: ${vars.region}
      domainName: ${vars.domainName}
      protocol: HTTPS
      # fc3-domain 不接受"只给 certName 让它自己去 CAS 取"的写法，
      # certificate / privateKey 必须同时给 PEM 正文，否则报
      # certConfig must contain certName, certificate and privateKey simultaneously。
      certConfig:
        certName: ${env(CERT_NAME)}
        certificate: ${file(../certs/fullchain.cer)}
        privateKey: ${file(../certs/private.key)}
      routeConfig:
        routes:
          - path: /
            functionName: ${vars.functionName}
            methods:
              - GET
              - HEAD
          - path: /*
            functionName: ${vars.functionName}
