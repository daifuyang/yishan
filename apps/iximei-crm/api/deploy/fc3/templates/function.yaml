edition: 3.0.0
name: iximei-crm-function
access: "default"   # OIDC STS profile written by the deploying workflow
vars:
  region: ${env(FUNCTION_REGION)}
  functionName: ${env(FUNCTION_NAME)}
resources:
  iximei_crm_function:
    component: fc3
    props:
      region: ${vars.region}
      description: ${env(FUNCTION_DESCRIPTION)}
      runtime: custom.debian12
      timeout: 60
      cpu: 1
      memorySize: 2048
      diskSize: 512
      instanceConcurrency: 100
      vpcConfig:
        vpcId: ${env(FUNCTION_VPC_ID)}
        vSwitchIds:
          - ${env(FUNCTION_VSWITCH_ID)}
        securityGroupId: ${env(FUNCTION_SECURITY_GROUP)}
      environmentVariables:
        # 函数名回读：请求日志用它在线上自报家门，避免多环境混查。
        FUNCTION_NAME: ${vars.functionName}
        NODE_ENV: production
        PORT: '3000'
        TRUST_PROXY_IPS: ${env('TRUST_PROXY_IPS', '')}
        LOG_LEVEL: ${env(LOG_LEVEL)}
        PATH: /var/fc/lang/nodejs22/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin:/code:/code/bin
        NODE_PATH: /code/node_modules
        LD_LIBRARY_PATH: /code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib
        DATABASE_USER: ${env(DATABASE_USER)}
        DATABASE_PASSWORD: ${env(DATABASE_PASSWORD)}
        DATABASE_NAME: ${env(DATABASE_NAME)}
        DATABASE_HOST: ${env(DATABASE_HOST)}
        DATABASE_PORT: ${env(DATABASE_PORT)}
        JWT_SECRET: ${env(JWT_SECRET)}
        REDIS_URL: ${env(REDIS_URL)}
        # 与 demo 共用同一 Redis 实例时必须隔离 key 前缀，否则缓存会串。
        CACHE_NAMESPACE: ${env('CACHE_NAMESPACE', 'yishan:iximei-crm')}
        REDIS_HOST: ${env(REDIS_HOST)}
        REDIS_PORT: ${env(REDIS_PORT)}
        REDIS_PASSWORD: ${env(REDIS_PASSWORD)}
        REDIS_DB: ${env(REDIS_DB)}
        # 历史账号密码兼容：ThinkCMF 的 ###md5(md5(authcode+pw))。
        # 未配置时老格式账号一律登录失败（不会退化成放行），新格式账号不受影响。
        LEGACY_AUTHCODE: ${env('LEGACY_AUTHCODE', '')}
        # Admin 部署形态：admin 编译为 /admin/ 前缀并由同站 API 提供静态资源。
        ADMIN_BASE_PATH: ${env('ADMIN_BASE_PATH', '/admin')}
        ADMIN_REDIRECT_ROOT: ${env('ADMIN_REDIRECT_ROOT', 'true')}
        YISHAN_API_VERSION: ${env('YISHAN_API_VERSION', '')}
        GIT_COMMIT_SHA: ${env('GIT_COMMIT_SHA', '')}
        BUILD_TIME: ${env('BUILD_TIME', '')}
      customRuntimeConfig:
        command:
          - node
          - ./dist/main.js
        port: 3000
      functionName: ${vars.functionName}
      # 产物默认放在仓库外（/tmp）：fc3 组件打包 code 时会套用 .gitignore，
      # 而 api 目录的 .gitignore 里有 /public/admin，会把 Admin 静态资源排除掉。
      code: ${env('FUNCTION_CODE_DIR', '../.build/function-code')}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
              - HEAD
            authType: anonymous
