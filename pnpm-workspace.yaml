packages:
  - 'apps/*'
  - 'apps/*/*'
  - 'packages/*'
  - 'packages/*/*'
  - 'modules/*'
  # 排除各 app 下的 example/ 子项目：它们是 gitignored 的本地组件演示项目，
  # 不参与 monorepo 的依赖图。在 Windows 上同时会触发 pnpm 创建 junction 时的 EBUSY。
  - '!**/example/**'
  - '!**/dist/**'
  - '!**/build/**'

  # Docs 的内容、页面、组件、配置和静态资源不是独立 Workspace。
  - '!apps/*/docs/content/**'
  - '!apps/*/docs/app/**'
  - '!apps/*/docs/components/**'
  - '!apps/*/docs/config/**'
  - '!apps/*/docs/public/**'
